# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - staging
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_CONFIG: ${{ github.ref_name == 'staging' && secrets.NEXT_PUBLIC_FIREBASE_CONFIG_STAGING || secrets.NEXT_PUBLIC_FIREBASE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ github.ref_name == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_CLIPABIT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT_CLIPABIT }}
          channelId: live
          projectId: ${{ github.ref_name == 'staging' && 'clipabit-staging' || 'clipabit' }}
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
