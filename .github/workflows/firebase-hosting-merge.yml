# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches: [staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write
    
jobs:
  # ------------------------------------------------------------------
  # STAGING DEPLOYMENT (Runs on push to 'staging')
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_AUTH0_DOMAIN: ${{ secrets.NEXT_PUBLIC_AUTH0_DOMAIN_STAGING }}
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_AUTH0_CLIENT_ID_STAGING }}
      NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.NEXT_PUBLIC_AUTH0_AUDIENCE_STAGING }}
      NEXT_PUBLIC_DEMO_ENV: staging
      NEXT_PUBLIC_FILE_CHANGE_ENABLED: true
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLIPABIT_STAGING }}
          channelId: live
          projectId: clipabit-staging-9ec32
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
  # ------------------------------------------------------------------
  # PRODUCTION DEPLOYMENT (Runs on push to 'main')
  # ------------------------------------------------------------------
  deploy-prod:
    name: Deploy Prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      NEXT_PUBLIC_AUTH0_DOMAIN: ${{ secrets.NEXT_PUBLIC_AUTH0_DOMAIN }}
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
      NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.NEXT_PUBLIC_AUTH0_AUDIENCE }}
      NEXT_PUBLIC_DEMO_ENV: prod
      NEXT_PUBLIC_FILE_CHANGE_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLIPABIT }}
          channelId: live
          projectId: clipabit
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
